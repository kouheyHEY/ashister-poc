<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="description" content="欲しいものを覚えて、ひとつずつ叶えるキャラクター型アシスタントのPoCです。" />
    <title>アシスター — 欲しいものを、ひとつずつ。</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="main-content">
        <header class="app-header">
          <a class="brand" href="#home" data-go="home" aria-label="アシスター ホーム">
            <span class="brand-mark" aria-hidden="true">A</span><span>アシスター</span><small>PoC</small>
          </a>
          <div class="menu-wrap">
            <button class="menu-button" id="menuButton" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPopover"><span></span><span></span><span></span></button>
            <div class="menu-popover" id="menuPopover" hidden>
              <p class="eyebrow">設定とデータ</p>
              <div class="menu-status"><i aria-hidden="true"></i><span>体験版<br /><small>入力はこの端末だけに保存されます</small></span></div>
              <button class="menu-reset" id="resetButtonMenu" type="button">体験データをリセット</button>
            </div>
          </div>
        </header>

        <section class="view is-visible" id="homeView" data-page="home">
          <div class="page-heading home-heading">
            <p class="eyebrow" id="todayLabel">今日</p>
            <h1>おかえりなさい</h1>
          </div>

          <article class="assistant-card">
            <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
            <div class="character-wrap" aria-label="笑顔のアシスタントキャラクター">
              <div class="character-shadow"></div>
              <div class="character" id="character">
                <span class="antenna"><i></i></span>
                <div class="character-face"><span class="eye eye-left"></span><span class="eye eye-right"></span><span class="cheek cheek-left"></span><span class="cheek cheek-right"></span><span class="mouth"></span></div>
                <span class="character-badge">A</span>
              </div>
            </div>
            <div class="assistant-copy">
              <span class="assistant-label">今日のアシスター</span>
              <h2 id="assistantMessage">欲しいものを、ひとつずつ叶えていきましょう。</h2>
              <p id="assistantSubmessage">思いついたら、忘れないうちに置いておけます。</p>
              <div class="assistant-actions">
                <button class="primary-button" data-open-wish type="button">＋ 欲しいものを追加</button>
                <button class="secondary-button" data-go="wishes" type="button">リストを見る</button>
              </div>
            </div>
          </article>

          <div class="home-grid">
            <article class="summary-card next-card">
              <div><p class="eyebrow">次に叶えたいもの</p><h2 id="homeNextWishName">登録してみましょう</h2><p class="summary-detail" id="homeNextWishReason">欲しい理由も一緒に残せます</p></div>
              <div class="summary-footer"><strong id="homeNextWishPrice">—</strong><button data-go="wishes" type="button" aria-label="欲しいもの一覧を見る">→</button></div>
            </article>

            <article class="summary-card progress-card">
              <div><p class="eyebrow">これまでの実現</p><div class="progress-line"><div class="progress-ring" id="homeProgressRing"><span id="homeWishRate">0%</span></div><strong id="homeWishHeadline">0個、実現しました</strong></div></div>
              <div class="summary-footer"><span id="homeWishDetail">欲しいものを登録してみましょう</span><button data-go="wishes" type="button" aria-label="実現状況を見る">→</button></div>
            </article>
          </div>
        </section>

        <section class="view" id="wishesView" data-page="wishes">
          <div class="page-heading list-heading">
            <div><p class="eyebrow">欲しいもの</p><h1>いつかを、見える形に</h1></div>
            <button class="primary-button compact-button" id="openWishForm" type="button">＋ 追加</button>
          </div>

          <div class="stats-grid">
            <article class="stat-card"><span>欲しい</span><strong id="activeWishCount">0</strong><small>個</small></article>
            <article class="stat-card"><span>買えた</span><strong id="purchasedWishCount">0</strong><small>個</small></article>
            <article class="stat-card accent-stat"><span>実現率</span><strong id="wishRate">0</strong><small>%</small></article>
          </div>

          <div class="filter-buttons" role="group" aria-label="欲しいものの絞り込み">
            <button class="filter-button is-active" data-filter="all" type="button">すべて</button>
            <button class="filter-button" data-filter="active" type="button">欲しい</button>
            <button class="filter-button" data-filter="purchased" type="button">買えた</button>
            <button class="filter-button" data-filter="hold" type="button">保留</button>
          </div>

          <div class="wish-list" id="wishList"></div>
          <div class="empty-state" id="wishEmpty" hidden><span>◇</span><h2>まだ登録されていません</h2><p>気になっているものを、ひとつ置いてみましょう。</p><button class="primary-button" data-open-wish type="button">最初のひとつを追加</button></div>
          <div class="pagination" id="wishPagination"><button id="previousWishPage" type="button" aria-label="前のページ">←</button><span id="wishPageLabel">1 / 1</span><button id="nextWishPage" type="button" aria-label="次のページ">→</button></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="画面メニュー">
        <button class="bottom-item is-active" data-view="home" type="button"><span aria-hidden="true">⌂</span>ホーム</button>
        <button class="bottom-item" data-view="wishes" type="button"><span aria-hidden="true">◇</span>欲しいもの</button>
      </nav>
    </div>

    <dialog id="wishDialog">
      <form method="dialog" id="wishForm">
        <div class="dialog-heading"><div><p class="eyebrow">欲しいもの</p><h2>新しく追加する</h2></div><button class="close-button" value="cancel" type="submit" aria-label="閉じる">×</button></div>
        <label>名前<span>必須</span><input id="wishName" required maxlength="60" placeholder="例：読みやすい電子書籍リーダー" /></label>
        <label>欲しい理由<textarea id="wishReason" rows="3" maxlength="160" placeholder="これがあると、どんな時間が増えそうですか？"></textarea></label>
        <div class="form-row">
          <label>おおよその価格<input id="wishPrice" inputmode="numeric" placeholder="例：30000" /></label>
          <label>優先度<select id="wishPriority"><option value="high">高め</option><option value="medium" selected>ふつう</option><option value="low">いつか</option></select></label>
        </div>
        <div class="dialog-actions"><button class="secondary-button" value="cancel" type="submit">キャンセル</button><button class="primary-button" id="saveWish" value="default" type="submit">リストに追加</button></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
